<title>Защита Камилы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: one retro terminal window; a comic "attack" log plays, then a big defeat screen */
:root {
  --bg: #07090f;
  --panel: #0d1220;
  --line: #1f2a44;
  --fg: #9fe8c2;
  --dim: #56708f;
  --pink: #ff8fc8;
  --warn: #ffd36b;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --pixel: "Press Start 2P", "JetBrains Mono", monospace;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--mono); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
}
.term {
  max-width: 640px; margin: 0 auto; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  box-shadow: 0 0 40px rgba(255,143,200,.08);
}
.bar { display: flex; gap: 6px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 12px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.bar span { margin-left: 8px; }
.body { padding: 18px; display: flex; flex-direction: column; gap: 14px; min-height: 360px; }
h1 { font-family: var(--pixel); font-size: clamp(14px, 4vw, 20px); line-height: 1.5; color: var(--pink); margin: 0; text-wrap: balance; }
.log { display: flex; flex-direction: column; gap: 4px; line-height: 1.5; min-width: 0; word-break: break-word; }
.log .ok { color: var(--fg); }
.log .bad { color: var(--warn); }
.log .dim { color: var(--dim); }
.prog { height: 14px; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--fg); transition: width .3s; }
.pct { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
button {
  font: inherit; font-family: var(--pixel); font-size: 12px; color: var(--bg); background: var(--fg);
  border: 0; border-radius: 4px; padding: 14px 18px; cursor: pointer; align-self: flex-start;
}
button:focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; }
.final { text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center; padding-block: 12px; }
.final .lock { font-size: 56px; line-height: 1; }
.final h2 { font-family: var(--pixel); font-size: clamp(14px, 4.4vw, 20px); line-height: 1.6; color: var(--pink); margin: 0; text-wrap: balance; }
.final p { margin: 0; max-width: 42ch; line-height: 1.6; color: var(--fg); }
.final small { color: var(--dim); }
.final button { align-self: center; background: var(--pink); }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
.shake { animation: shake .3s 3; }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } .prog i { transition: none; } }
</style>

<div class="term" id="term">
  <div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span>kamila_firewall.exe</span></div>
  <div class="body" id="screen">
    <h1>Операция «Номер Камилы»</h1>
    <div class="log">
      <div class="dim">&gt; цель: Камила</div>
      <div class="dim">&gt; уровень защиты: неизвестен</div>
      <div class="dim">&gt; уверенность хакера: 100%</div>
    </div>
    <button id="start" type="button">Начать взлом</button>
  </div>
</div>

<script>
const steps = [
  ["ok",  "Подключаюсь к серверу её хорошего настроения…"],
  ["ok",  "Подбираю пароль: «котик», «кофе», «лето»…"],
  ["bad", "Отказано: пароль слишком милый, чтобы его угадать"],
  ["ok",  "Пробую обойти защиту комплиментом…"],
  ["bad", "Комплимент принят, но доступ не выдан"],
  ["ok",  "Запускаю шоколадку.exe…"],
  ["bad", "Шоколадка съедена. Доступ всё ещё закрыт"],
  ["ok",  "Подключаю тяжёлую артиллерию: мемы…"],
  ["bad", "Она засмеялась, но номер не сказала"],
  ["bad", "КРИТИЧЕСКАЯ ОШИБКА: харизма Камилы превышает возможности системы"]
];
const screen = document.getElementById("screen");
const wait = ms => new Promise(r => setTimeout(r, ms));

document.getElementById("start").addEventListener("click", run);

async function run() {
  screen.innerHTML = '<h1>Взлом идёт…</h1><div class="prog"><i id="bar"></i></div><div class="pct" id="pct">0%</div><div class="log" id="log"></div>';
  const log = document.getElementById("log"), bar = document.getElementById("bar"), pct = document.getElementById("pct");
  for (let i = 0; i < steps.length; i++) {
    const [cls, text] = steps[i];
    const line = document.createElement("div");
    line.className = cls;
    line.textContent = "> " + text;
    log.appendChild(line);
    const p = i === steps.length - 1 ? 99 : Math.round((i + 1) / steps.length * 97);
    bar.style.width = p + "%"; pct.textContent = p + "%";
    await wait(cls === "bad" ? 1100 : 800);
  }
  pct.textContent = "99%… застряло на 99%";
  await wait(1400);
  const t = document.getElementById("term");
  t.classList.add("shake");
  await wait(900);
  t.classList.remove("shake");
  showFinal();
}

function showFinal() {
  screen.innerHTML = `
    <div class="final">
      <div class="lock">🔒</div>
      <h2>Камила, у тебя слишком надёжная защита</h2>
      <p>Я перепробовал всё: пароли, комплименты, шоколадку и мемы. Система не поддаётся. Признаю поражение.</p>
      <p>Остался один способ, который точно работает: просто дать мне свой номер 🙂</p>
      <small>Хакер сдаётся. Победа за тобой.</small>
      <button id="again" type="button">Попробовать ещё раз</button>
    </div>`;
  document.getElementById("again").addEventListener("click", run);
}
</script>
